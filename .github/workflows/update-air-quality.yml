name: Perbarui Data

on:
  schedule:
    # Menit ke-7: BMKG + IQAir (opsional). Menit 22/37/52: BMKG saja.
    # Jadwal GitHub bisa tertunda beberapa menit saat server sibuk.
    - cron: "7 * * * *"
    - cron: "22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IQAIR_API_KEY: ${{ secrets.IQAIR_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Siapkan Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Salin peringatan dini BMKG
        continue-on-error: true
        run: node scripts/fetch-bmkg.mjs

      - name: Ambil data stasiun IQAir (opsional)
        if: env.IQAIR_API_KEY != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *')
        continue-on-error: true
        run: node scripts/fetch-iqair.mjs

      - name: Simpan ke repositori
        run: |
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: pembaruan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
